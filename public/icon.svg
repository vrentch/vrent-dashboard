<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232326"/>
      <stop offset="0.55" stop-color="#141416"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="256" rx="116" fill="url(#sheen)"/>

  <!-- AC monogram -->
  <text x="256" y="292" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif"
        font-weight="800" font-size="216" letter-spacing="-8" fill="#ffffff">AC</text>

  <!-- APP wordmark -->
  <text x="259" y="356" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="62" letter-spacing="26" fill="#ffffff" fill-opacity="0.88">APP</text>

  <!-- subtle monochrome pulse -->
  <path d="M150 408 h120 l26 -30 l28 40 l36 -60 l22 50 h30"
        fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="13"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
