<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="256" rx="116" fill="url(#sheen)"/>

  <!-- AC monogram -->
  <text x="256" y="270" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif"
        font-weight="800" font-size="210" letter-spacing="-6" fill="#ffffff">AC</text>

  <!-- NEWS wordmark -->
  <text x="258" y="336" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="60" letter-spacing="24" fill="#ffffff" fill-opacity="0.92">NEWS</text>

  <!-- market pulse underline with up-tick -->
  <path d="M120 404 h150 l28 -34 l30 44 l40 -70 l24 60 h56"
        fill="none" stroke="#34d399" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="392" cy="334" r="12" fill="#34d399"/>
</svg>
