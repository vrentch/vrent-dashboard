<!-- Blanche Beauty — persistent "Book now" action routing to Phorest.
     Injected site-wide via the Wix Custom Embeds API at BODY_END, category ESSENTIAL.
     Removing it is one DELETE call; it touches nothing else on the site.
     Class names are namespaced bb- to avoid colliding with Wix's own styles. -->

<style>
  .bb-book-fab {
    position: fixed;
    z-index: 9990;
    right: max(20px, env(safe-area-inset-right));
    bottom: max(20px, env(safe-area-inset-bottom));
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    min-height: 52px;
    padding: 0 26px;
    border-radius: 999px;
    background: #1A1714;
    color: #F7F4EF;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .02em;
    text-decoration: none;
    box-shadow: 0 2px 6px rgba(26,23,20,.18), 0 12px 32px -10px rgba(26,23,20,.42);
    transition: transform .18s ease, box-shadow .18s ease, background-color .18s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .bb-book-fab:hover,
  .bb-book-fab:focus-visible {
    background: #2B2621;
    transform: translateY(-1px);
    box-shadow: 0 3px 8px rgba(26,23,20,.20), 0 16px 38px -10px rgba(26,23,20,.50);
    color: #F7F4EF;
  }

  .bb-book-fab:focus-visible {
    outline: 2px solid #F7F4EF;
    outline-offset: 3px;
  }

  .bb-book-fab:active { transform: translateY(0) scale(.98); }

  .bb-book-fab svg { flex: none; }

  /* Phone: a centred pill that clears the thumb zone without spanning the screen. */
  @media (max-width: 600px) {
    .bb-book-fab {
      right: auto;
      left: 50%;
      transform: translateX(-50%);
      bottom: max(16px, env(safe-area-inset-bottom));
      min-height: 50px;
      padding: 0 30px;
      font-size: 15.5px;
    }
    .bb-book-fab:hover,
    .bb-book-fab:focus-visible { transform: translateX(-50%) translateY(-1px); }
    .bb-book-fab:active { transform: translateX(-50%) scale(.98); }
  }

  /* Don't sit on top of the page footer's own content when printing. */
  @media print { .bb-book-fab { display: none; } }

  @media (prefers-reduced-motion: reduce) {
    .bb-book-fab { transition: none; }
    .bb-book-fab:hover,
    .bb-book-fab:focus-visible { transform: none; }
    @media (max-width: 600px) {
      .bb-book-fab:hover,
      .bb-book-fab:focus-visible { transform: translateX(-50%); }
    }
  }
</style>

<a
  class="bb-book-fab"
  href="https://www.phorest.com/salon/blanchebeauty"
  target="_blank"
  rel="noopener"
  aria-label="Book an appointment at Blanche Beauty">
  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="3" y="4" width="18" height="18" rx="2"></rect>
    <path d="M16 2v4M8 2v4M3 10h18"></path>
  </svg>
  Book now
</a>
